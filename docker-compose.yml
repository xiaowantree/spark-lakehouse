version: "3.8"

services:
  # ---------- MinIO ----------
  minio:
    image: minio/minio:latest         # 或者用你之前初始化时的同一 tag（如果记得）
    platform: linux/arm64/v8
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    command: server /data --console-address ":9001"
    ports: ["9000:9000","9001:9001"]
    volumes:
      - ./minio-data:/data
    networks: [lake-net]

  # 自动创建 wba 桶
  createbucket:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    platform: linux/arm64/v8
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 admin admin12345;
      mc mb -p myminio/wba || true;
      "
    networks: [lake-net]

  # ---------- Postgres for Hive Metastore ----------
  postgres:
    image: postgres:14-alpine
    platform: linux/arm64/v8
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: metastore_db
      PPOSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    ports: ["5432:5432"]
    networks: [lake-net]

  # ---------- Hive Metastore ----------
  hive-metastore:
    image: apache/hive:3.1.3
    platform: linux/amd64            # M4 上以 x86 仿真运行
    container_name: hive-metastore
    depends_on: [postgres]
    # 关键：禁用镜像自带的 entrypoint，避免被强制跑 derby/CLI
    entrypoint: []
    command: >
      bash -lc "
      /opt/hive/bin/schematool -dbType postgres -info ||
      /opt/hive/bin/schematool -dbType postgres -initSchema --verbose;
      /opt/hive/bin/hive --service metastore"
    ports: ["9083:9083"]
    volumes:
      - ./hive-config:/opt/hive/conf
      # 用本地仓库目录（不走 S3A，最稳），下面这行可选挂载到宿主机
      - ./spark/jars/postgresql-42.7.2.jar:/opt/hive/lib/postgresql-9.4.1208.jre7.jar
    networks: [lake-net]

  # ---------- Spark Master ----------
  spark-master:
    image: apache/spark:3.4.1
    platform: linux/arm64/v8
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.master.Master","--host","spark-master","--port","7077","--webui-port","8080"]
    ports: ["7077:7077","8080:8080"]
    volumes:
      - ./spark-config:/opt/spark/conf
    networks: [lake-net]

  # ---------- Spark Worker ----------
  spark-worker-1:
    image: apache/spark:3.4.1
    platform: linux/arm64/v8
    container_name: spark-worker-1
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.worker.Worker","spark://spark-master:7077","--webui-port","8081"]
    ports: ["8081:8081"]
    volumes:
      - ./spark-config:/opt/spark/conf
      - ./spark/jars:/opt/spark/jars
    networks: [lake-net]

  # ---------- Kyuubi（博客版 1.8，默认 Binary/无认证） ----------
  kyuubi:
    image: apache/kyuubi:1.8.0-spark
    platform: linux/amd64         # 只 Kyuubi 走 amd64 仿真；其余全是 ARM64 原生
    container_name: kyuubi
    depends_on: [spark-master, hive-metastore]
    ports: ["10009:10009","10099:10099"]
    volumes:
      - ./kyuubi-config/kyuubi-defaults.conf:/opt/kyuubi/conf/kyuubi-defaults.conf
      - ./spark/jars:/opt/spark/jars
    networks: [lake-net]

networks:
  lake-net:
    driver: bridge
